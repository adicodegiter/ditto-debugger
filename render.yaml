# Render Blueprint for the Ditto Debugger.
#
# This replaces the manual dashboard setup and fixes the two production problems:
#   1. The backend must bind to 0.0.0.0 and Render's assigned $PORT (the old local
#      `--host 127.0.0.1 --port 8000` command is unreachable from Render's edge -> 503).
#   2. The static frontend calls the backend on a different origin, so the API sends
#      CORS headers (see backend/app/main.py) and the dashboard is pointed at the backend.
#
# Create this as a new Blueprint in Render (New + -> Blueprint) pointing at this repo, or use
# it as the reference for the equivalent manual service settings. Env vars marked sync:false
# must be filled in the Render dashboard (never commit real secrets).

databases: []

services:
  # ---- Backend: FastAPI workbench API --------------------------------------------
  - type: web
    name: ditto-debugger-api
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    # Bind to all interfaces on Render's assigned port. PYTHONPATH=. makes the repo-root
    # packages (safety, monitor, ai, tools) importable; --app-dir backend puts app.* on the path.
    startCommand: "PYTHONPATH=. python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Loopback Ditto/Prometheus are intentionally NOT set in production. Without them the
      # backend still serves health, overview, component status, experiments, runs and safety
      # from the committed manifests and any recorded data, and it reports Ditto/Prometheus as
      # unavailable rather than pretending they are connected.
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: CHAOS_EXECUTION_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        # Comma-separated browser origins allowed to call the API. Keep in sync with the
        # frontend service URL below. Add your own preview/custom domains here too.
        value: "https://ditto-debugger.onrender.com,http://localhost:8000,http://127.0.0.1:8000"
      # Optional, only if you later deploy Ditto/Prometheus somewhere reachable:
      # - key: DITTO_BASE_URL
      #   sync: false
      # - key: PROMETHEUS_URL
      #   sync: false

  # ---- Frontend: static dashboard site -------------------------------------------
  - type: web
    name: ditto-debugger
    runtime: static
    plan: free
    region: oregon
    rootDir: .
    # There is no build step: the frontend is plain HTML/CSS/JS. Render copies the publish
    # directory as-is. config.js (loaded first) points the UI at the backend above.
    buildCommand: ""
    staticPublishPath: frontend
    headers:
      - path: /*
        name: Cache-Control
        value: "no-cache"
    # No rewrite rule: the dashboard uses hash-based routing (#/overview, #/runs/...), so the
    # server never needs to serve index.html for deep paths, and a greedy /* -> /index.html
    # rewrite could shadow static assets (/app.js, /styles.css, /config.js). Render serves the
    # static files and index.html at "/" by default.
    autoDeploy: true
