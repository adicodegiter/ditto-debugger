version: 1
scope:
  environment: local-only
  compose_project: ditto
  allowed_targets:
    - gateway
    - things-search
  denied_targets:
    - mongodb
max_concurrent_experiments: 1
# Hard ceiling for any fault. CLAUDE.md M4 is a 60 s things-search stop.
max_duration_seconds: 60
max_risk_score: 0.35
baseline_max_age_seconds: 3600
target_risk_scores:
  gateway: 0.2
  things-search: 0.3
  mongodb: 0.3   # cpu_throttle only
  nginx: 0.15    # traffic_burst only
approval:
  required: true
  expires_after_minutes: 10
# Fixed action catalog. Each name maps to one hard-coded Docker Compose command in
# safety/runner.py; anything else is rejected when the policy is loaded.
actions:
  restart_container:
    enabled: true
    duration_seconds_default: 10
    cleanup: restart_target
  stop_container:
    enabled: true
    duration_seconds_default: 60
    cleanup: restart_target
  # Freezes every process in the target; rollback unpauses it.
  pause_container:
    enabled: true
    duration_seconds_default: 30
    cleanup: unpause_target
  # Leaves the target only `cpus` CPUs (CFS quota); rollback restores the captured quota.
  # The only action allowed on mongodb (listed explicitly; stop/restart/pause stay denied).
  cpu_throttle:
    enabled: true
    targets: [mongodb, things-search]
    cpus: 0.25
    duration_seconds_default: 60
    cleanup: restore_cpu_quota
  # Extra bounded fleet load through the API entry point; ends by itself at the deadline.
  traffic_burst:
    enabled: true
    targets: [nginx]
    rate_per_second: 10
    vehicles: 16
    duration_seconds_default: 60
    cleanup: stop_burst
# Kill switch (CLAUDE.md "Kill switch thresholds"). Evaluated every poll_interval_seconds
# while a fault is active, over the last window_seconds of SLI samples. Limits come only
# from this file; observations can never override them.
abort_thresholds:
  window_seconds: 30
  poll_interval_seconds: 2
  write_error_rate: 0.20
  write_p95_multiplier: 3.0
  freshness_p95_seconds: 30
  min_write_samples: 3
  min_freshness_samples: 1
recovery:
  timeout_seconds: 180
  poll_interval_seconds: 3
# Independent watchdog process: restarts the target this many seconds after the
# fault's planned end, even if the runner process has died.
watchdog:
  grace_seconds: 15
abort_conditions:
  - baseline_unhealthy
  - unrelated_component_unhealthy
  - error_rate_above_configured_limit
  - p95_latency_above_baseline_multiplier
  - freshness_p95_above_limit
  - missing_samples
  - experiment_deadline_exceeded
notes:
  - Execution never runs inside the API. Only the separate operator process runs experiments
    (python -m safety.cli execute EXPERIMENT_ID), and only with CHAOS_EXECUTION_ENABLED=true.
  - Never point a runner at a public, shared, or production deployment.
