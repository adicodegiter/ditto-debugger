openapi: 3.1.0
info:
  title: Ditto AI Chaos Engineering API
  version: 1.0.0
  description: Loopback-only discovery, planning, approval-record, history, and findings API. Fault execution is disabled.
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/agents:
    get:
      operationId: getAgentStatus
      responses:
        "200":
          description: Status of the local specialist agents
  /api/v1/health:
    get:
      operationId: getWorkbenchHealth
      responses:
        "200":
          description: Workbench process health; not a target health check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/discovery/refresh:
    post:
      operationId: refreshDiscovery
      responses:
        "200":
          description: Read-only discovery and graph refresh
          content:
            application/json:
              schema:
                $ref: "./graph.schema.json"
  /api/v1/architecture:
    get:
      operationId: getArchitecture
      responses:
        "200":
          description: Versioned provenance-labelled dependency graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Architecture"
  /api/v1/telemetry:
    get:
      operationId: getTelemetry
      responses:
        "200":
          description: Normalized observations and metric coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Telemetry"
  /api/v1/baselines:
    post:
      operationId: captureBaseline
      responses:
        "200":
          description: Persist a baseline only when graph and telemetry are healthy
  /api/v1/experiments:
    get:
      operationId: listExperiments
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Saved proposal snapshots and approval states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
  /api/v1/experiments/plan:
    post:
      operationId: planExperiments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "201":
          description: Persisted ranked candidates; no fault is executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "404":
          description: Baseline was not found
        "422":
          description: Architecture or telemetry preconditions are unavailable
  /api/v1/experiments/{experiment_id}:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    get:
      operationId: getExperiment
      responses:
        "200":
          description: Candidate and current approval state
          content:
            application/json:
              schema:
                $ref: "./experiment.schema.json"
        "404":
          description: Proposal was not found
  /api/v1/experiments/{experiment_id}/status:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    get:
      operationId: getExperimentStatus
      responses:
        "200":
          description: Record-only approval state; execution remains disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentStatus"
        "404":
          description: Proposal was not found
  /api/v1/experiments/{experiment_id}/approval:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    post:
      operationId: recordApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "201":
          description: Human decision recorded; execution has not started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "404":
          description: Proposal was not found
        "409":
          description: Candidate hash is stale or a decision already exists
  /api/v1/experiments/{experiment_id}/execute:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    post:
      operationId: executeApprovedExperiment
      responses:
        "503":
          description: Fault execution is disabled until the isolated runner passes its safety gate
  /api/v1/runs:
    get:
      operationId: listExperimentRuns
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Persisted experiment run history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunHistoryResponse"
  /api/v1/runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getExperimentRun
      responses:
        "200":
          description: Prediction, observations, cleanup, and recovery record
          content:
            application/json:
              schema:
                $ref: "./result.schema.json"
        "404":
          description: Run was not found
  /api/v1/findings:
    get:
      operationId: getFindings
      parameters:
        - name: run_id
          in: query
          required: false
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Evidence-backed findings, optionally filtered by run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsResponse"
        "404":
          description: Run was not found
  /api/v1/audit:
    get:
      operationId: listAuditEvents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Safety, execution, cleanup, and recovery audit history
components:
  parameters:
    ExperimentId:
      name: experiment_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    Health:
      type: object
      required: [status, execution_enabled, agents, notes]
      properties:
        status: { const: ok }
        execution_enabled: { type: boolean }
        agents: { type: array, items: { type: object } }
        notes: { type: array, items: { type: string } }
    Architecture:
      $ref: "./graph.schema.json"
    Inventory:
      $ref: "./inventory.schema.json"
    Observation:
      $ref: "./observation.schema.json"
    ExperimentResult:
      $ref: "./result.schema.json"
    Telemetry:
      type: object
      required: [schema_version, status, observed_at, coverage, target_count, healthy_target_count, observations, warnings]
      properties:
        schema_version: { const: "1.0" }
        status: { enum: [available, degraded, unavailable] }
        observed_at: { type: string, format: date-time }
        coverage: { type: number, minimum: 0, maximum: 1 }
        target_count: { type: integer, minimum: 0 }
        healthy_target_count: { type: integer, minimum: 0 }
        observations:
          type: array
          items: { $ref: "./observation.schema.json" }
        warnings: { type: array, items: { type: string } }
    PlanRequest:
      type: object
      additionalProperties: false
      required: [baseline_id, max_candidates]
      properties:
        baseline_id: { type: string, minLength: 1, maxLength: 100 }
        max_candidates: { type: integer, minimum: 1, maximum: 10, default: 3 }
    PlanResponse:
      $ref: "./experiment-plan.schema.json"
    PlansResponse:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items: { $ref: "./experiment-plan.schema.json" }
    ExperimentStatus:
      type: object
      required: [experiment_id, status, approval, execution_enabled]
      properties:
        experiment_id: { type: string }
        status: { enum: [pending, approved, rejected, expired] }
        approval: { type: [object, "null"] }
        execution_enabled: { const: false }
    RunHistoryResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "./result.schema.json" }
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision, reason, candidate_hash]
      properties:
        decision: { enum: [approve, reject] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        candidate_hash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    ApprovalResponse:
      type: object
      required: [approval_id, decision, expires_at, candidate_hash]
      properties:
        approval_id: { type: string }
        decision: { enum: [approve, reject] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        candidate_hash: { type: string }
        execution_enabled: { const: false }
    FindingsResponse:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          items: { $ref: "./finding.schema.json" }
